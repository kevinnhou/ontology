[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "supervision>=0.25",
  "ultralytics>=8.3",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]
lint = [
  "ruff>=0.8",
  "ty>=0.0.65",
]
test = [
  "httpx>=0.28",
  "httpx2>=2.9.1",
  "pytest>=8.3",
]

[project.scripts]
vision = "vision.main:run_dev"

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv"
python-version = "3.13"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]
exclude = [".venv", ".ruff_cache", ".pytest_cache"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = [".venv", ".ruff_cache", ".pytest_cache"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
executionEnvironments = [
  { root = "src" },
  { root = "tests", extraPaths = ["src"] },
]
