[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]
lint = [
  "ruff>=0.8",
]
test = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[project.scripts]
vision = "vision.main:run_dev"

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv"
root = ["./src"]
